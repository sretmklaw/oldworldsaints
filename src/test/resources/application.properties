# Data Source -- TEST ONLY
spring.datasource.initialization-mode=ALWAYS
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/cimeliarchium-db-schema
spring.datasource.username=postgres
spring.datasource.password=sdev!400

# Server -- TEST ONLY
server.error.include-stacktrace=ALWAYS
server.servlet.session.timeout=3600
security.require-ssl=true

# Logging
logging.file.name=logs/cimeliarchium-web-app.log
logging.logback.rollingpolicy.file-name-pattern=logs/cimeliarchium-web-app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.clean-history-on-start=FALSE
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=INFO
logging.level.com=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=ERROR

# JPA
spring.jpa.database=POSTGRESQL
spring.jpa.generate-ddl=TRUE
junit.jupiter.execution.parallel.enabled=true

# Hibernate -- TEST ONLY
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=TRUE
spring.jpa.properties.hibernate.proc.param_null_passing=TRUE
spring.jpa.show-sql=TRUE
spring.h2.console.enabled=TRUE
spring.http.log-request-details=TRUE

# Actuator
management.endpoint.beans.enabled=TRUE
management.endpoints.web.exposure.include=beans

# Reference PDFs
reference.maxpage.count=5

# Messages
spring.messages.basename=VALIDATION

# Searchable Date Range
datesearch.start.date=2000-01-01
datesearch.end.date=2099-12-31

